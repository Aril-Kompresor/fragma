<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragma | Notifikasi</title>
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261125h">
</head>
<body data-auth-required="true" data-section="notifications">
    <div class="app-shell">
        <header class="mobile-header">
            <a href="/" class="sidebar__brand" style="padding: 0;">
                <img src="/img/logo.svg" alt="Fragma Logo" class="brand-logo">
                <span>Fragma</span>
            </a>
        </header>

        <aside class="sidebar">
            <a href="/" class="sidebar__brand">
                <img src="/img/logo.svg" alt="Fragma Logo" class="brand-logo">
                <span>Fragma</span>
            </a>
            <nav class="sidebar__nav">
                <a href="/projects" class="sidebar__link" id="navProjects">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span>Projects</span>
                </a>
                <a href="/dashboard" class="sidebar__link" id="navEntity">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    <span>Perangkat</span>
                </a>
                <a href="/view" class="sidebar__link" id="navView">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    <span>Visualisasi</span>
                </a>
                <a href="/flow" class="sidebar__link" id="navFlow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" y1="9" x2="6" y2="21"></line></svg>
                    <span>Otomasi</span>
                </a>
                <a href="/notifications" class="sidebar__link sidebar__link--active" id="navNotifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <span>Notifikasi</span>
                </a>
                <a href="/storage" class="sidebar__link" id="navStorage">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    <span>Storage</span>
                </a>
                <a href="/simulation" class="sidebar__link nav-superadmin-only" id="navSimulation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                    <span>Simulasi</span>
                </a>
            </nav>
        </aside>

        <main class="app-main">
            <div class="tb-top-bar">
                <div class="tb-breadcrumbs">
                    <a href="/projects" class="tb-breadcrumb-item" id="breadcrumbProjectsRoot">Projects</a>
                    <span class="tb-breadcrumb-separator">&gt;</span>
                    <a href="/projects" class="tb-breadcrumb-item" id="breadcrumbProjectName">Project</a>
                    <span class="tb-breadcrumb-separator">&gt;</span>
                    <span class="tb-breadcrumb-item tb-breadcrumb-item--active">Notifikasi</span>
                </div>
            </div>

            <div class="tb-sub-bar">
                <div class="tb-tabs" role="tablist">
                    <button type="button" class="tb-tab tb-tab--active" data-filter="all" role="tab" aria-selected="true">
                        <span>Semua</span>
                        <span class="tb-tab__count" id="countAllNotif">0</span>
                    </button>
                    <button type="button" class="tb-tab" data-filter="unread" role="tab" aria-selected="false">
                        <span>Belum Dibaca</span>
                        <span class="tb-tab__count" id="countUnreadNotif">0</span>
                    </button>
                    <button type="button" class="tb-tab" data-filter="critical" role="tab" aria-selected="false">
                        <span>Critical</span>
                        <span class="tb-tab__count" id="countCriticalNotif">0</span>
                    </button>
                    <button type="button" class="tb-tab" data-filter="warning" role="tab" aria-selected="false">
                        <span>Warning</span>
                        <span class="tb-tab__count" id="countWarningNotif">0</span>
                    </button>
                    <button type="button" class="tb-tab" data-filter="info" role="tab" aria-selected="false">
                        <span>Info</span>
                        <span class="tb-tab__count" id="countInfoNotif">0</span>
                    </button>
                </div>
            </div>

            <div class="container tb-container">
                <div class="tb-panel">
                    <div class="tb-toolbar">
                        <div class="tb-toolbar__left">
                            <h1 class="tb-toolbar__title">Notifikasi Otomasi</h1>
                            <label class="tb-switch-label" title="Perbarui daftar notifikasi tiap 10 detik">
                                <input type="checkbox" id="notifPollingToggle" checked>
                                <span class="tb-switch-slider"></span>
                                <span>Live polling</span>
                            </label>
                        </div>
                        <div class="tb-toolbar__right tb-toolbar__right--wrap">
                            <select id="notifDeviceFilter" class="tb-filter-select" aria-label="Filter perangkat">
                                <option value="">Semua perangkat</option>
                            </select>
                            <div class="tb-search-wrap">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <input type="text" id="notifSearchInput" class="tb-search-input" placeholder="Cari pesan atau flow..." autocomplete="off">
                            </div>
                            <button type="button" class="tb-icon-btn" id="btnRefreshNotif" aria-label="Perbarui notifikasi" title="Perbarui notifikasi">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                            </button>
                            <button type="button" class="btn btn--ghost btn--sm" id="btnMarkAllRead">Tandai Dibaca</button>
                            <button type="button" class="btn btn--ghost btn--sm flow-delete-btn" id="btnClearAllNotif">Bersihkan</button>
                        </div>
                    </div>

                    <div class="tb-table-container">
                        <table class="tb-table tb-table--responsive" id="notificationsTable">
                            <thead>
                                <tr>
                                    <th style="width: 175px;">Waktu</th>
                                    <th style="width: 120px;">Level</th>
                                    <th style="min-width: 220px;">Pesan Peringatan</th>
                                    <th style="min-width: 170px;">Flow &amp; Perangkat</th>
                                    <th style="min-width: 220px;">Payload Data</th>
                                    <th style="width: 110px; text-align: right;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="notificationsTableBody"></tbody>
                        </table>
                        <div id="notificationsEmpty" class="tb-table-empty" style="display: none;">
                            <p style="margin-bottom: 12px;">Belum ada notifikasi peringatan dari Otomasi pada project ini.</p>
                            <a href="/flow" id="goToFlowFromNotif" class="btn btn--primary btn--sm">Buka Otomasi</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/utils.js?v=20261125g"></script>
    <script src="/js/api.js?v=20261125g"></script>
    <script src="/js/auth.js?v=20261125g"></script>
    <script src="/js/notifications.js?v=20261125g"></script>
</body>
</html>
