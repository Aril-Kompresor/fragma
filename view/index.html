<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global View - Fragma</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <header class="mobile-header">
            <a href="/" class="sidebar__brand" style="padding: 0;">
                <span class="navbar__logo-dot"></span>
                <span>Fragma</span>
            </a>
        </header>

        <aside class="sidebar">
            <a href="/" class="sidebar__brand">
                <span class="navbar__logo-dot"></span>
                <span>Fragma</span>
            </a>
            <nav class="sidebar__nav" style="flex: 1;">
                <a href="/view/index.html" class="sidebar__link sidebar__link--active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    View
                </a>
                <a href="/dashboard/index.html" class="sidebar__link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    Entity
                </a>
                <a href="/simulation/index.html" class="sidebar__link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                    Simulation
                </a>
            </nav>
            <nav class="sidebar__nav" style="padding-bottom: 24px;">
                <a href="/docs/api.md" class="sidebar__link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                    API Docs
                </a>
            </nav>
        </aside>

        <main class="app-main" style="display: flex; flex-direction: column; height: 100vh;">
            <div class="builder-header" style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; background: var(--bg-surface);">
                <div>
                    <h1 class="page-header__title" style="font-size: 1.25rem; margin-bottom: 0;">Global View</h1>
                    <p class="page-header__subtitle" style="font-size: 0.85rem; margin-bottom: 0;">Combined visualizations from all your entities</p>
                </div>
                <button id="fabAddWidget" class="btn btn--primary" style="display: flex; align-items: center; gap: 8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Widget
                </button>
            </div>

            <div class="builder-layout" style="flex: 1; min-height: 0;">
                <div class="builder-canvas grid-canvas" id="globalWidgetsGrid" style="position: relative; overflow: auto; width: 100%; height: 100%;">
                    <div id="globalWidgetsLoading" style="text-align: center; padding: 40px; color: var(--text-secondary);">
                        Loading visualizations...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Widget Modal -->
    <div id="addWidgetModal" class="modal-overlay" style="display: none;">
        <div class="widget-picker">
            <!-- Step 1: Bundle Categories -->
            <div id="pickerStep1" class="widget-picker__step">
                <div class="widget-picker__toolbar">
                    <h2 class="widget-picker__title">Select Widget Bundle</h2>
                    <button id="closeModalBtn" class="widget-picker__close" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="widget-picker__grid" id="bundleGrid">
                    <div class="bundle-card" data-bundle="charts">
                        <div class="bundle-card__preview">
                            <svg width="64" height="48" viewBox="0 0 64 48" fill="none">
                                <polyline points="4,40 16,20 28,30 40,10 52,24 60,8" stroke="#4ecdc4" stroke-width="2.5" fill="none"/>
                                <polyline points="4,44 16,32 28,38 40,22 52,34 60,18" stroke="#e74c6f" stroke-width="2" fill="none" opacity="0.6"/>
                            </svg>
                        </div>
                        <div class="bundle-card__name">Charts</div>
                        <div class="bundle-card__count">3 widgets</div>
                    </div>
                    <div class="bundle-card" data-bundle="counters">
                        <div class="bundle-card__preview">
                            <div style="font-size: 1.8rem; font-weight: 700; color: var(--accent); line-height: 1;">183</div>
                            <div style="font-size: 0.65rem; color: var(--text-muted); margin-top: 4px;">Total</div>
                        </div>
                        <div class="bundle-card__name">Count Widgets</div>
                        <div class="bundle-card__count">2 widgets</div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Sub-widgets in a bundle -->
            <div id="pickerStep2" class="widget-picker__step" style="display: none;">
                <div class="widget-picker__toolbar">
                    <button id="pickerBackBtn" class="widget-picker__back" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <h2 class="widget-picker__title" id="pickerStep2Title">Charts</h2>
                    <button id="closeModalBtn2" class="widget-picker__close" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="widget-picker__grid" id="subWidgetGrid"></div>
            </div>

            <!-- Step 3: Configure the selected widget -->
            <div id="pickerStep3" class="widget-picker__step" style="display: none;">
                <div class="widget-picker__toolbar">
                    <button id="pickerBackBtn2" class="widget-picker__back" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <h2 class="widget-picker__title" id="pickerStep3Title">Configure Widget</h2>
                    <button id="closeModalBtn3" class="widget-picker__close" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div class="widget-picker__config">
                    <form id="addVisualForm" style="display: flex; flex-direction: column; gap: 20px;">
                        <input type="hidden" id="visualTypeSelect" value="line-chart">

                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Select Entity</label>
                            <select id="visualEntitySelect" class="form-select" required>
                                <option value="">-- Choose Entity --</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Data Field</label>
                            <select id="visualFieldSelect" class="form-select" required>
                                <option value="">Select an entity first...</option>
                            </select>
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Custom Label (Optional)</label>
                            <input type="text" id="visualLabelInput" class="form-input" placeholder="e.g. Master Bedroom Temp">
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label class="form-label">Color Theme</label>
                            <div class="color-picker">
                                <button type="button" class="color-swatch active" style="background: #4ecdc4" data-color="#4ecdc4"></button>
                                <button type="button" class="color-swatch" style="background: #e74c6f" data-color="#e74c6f"></button>
                                <button type="button" class="color-swatch" style="background: #2ecc71" data-color="#2ecc71"></button>
                                <button type="button" class="color-swatch" style="background: #f39c12" data-color="#f39c12"></button>
                                <button type="button" class="color-swatch" style="background: #9b59b6" data-color="#9b59b6"></button>
                            </div>
                            <input type="hidden" id="visualColorInput" value="#4ecdc4">
                        </div>

                        <div style="margin-top: 8px; display: flex; justify-content: flex-end; gap: 12px;">
                            <button type="button" class="btn btn--ghost" id="cancelModalBtn">Cancel</button>
                            <button type="submit" class="btn btn--primary" id="submitAddVisualBtn">Add to Dashboard</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/dnd.js"></script>
    <script src="/js/widgets/line-chart.js"></script>
    <script src="/js/widgets/value-card.js"></script>
    <script src="/js/view.js"></script>
</body>
</html>
