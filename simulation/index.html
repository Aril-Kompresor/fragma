<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation: Fragma IoT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261021c">
    <script> </script>
</head>

<body>
    <div class="app-shell">
        <header class="mobile-header">
            <a href="/" class="sidebar__brand" style="padding: 0;">
                <span class="navbar__logo-dot"></span>
                <span>Fragma</span>
            </a>
        </header>

        <aside class="sidebar">
            <a href="/" class="sidebar__brand">
                <span class="navbar__logo-dot"></span>
                <span>Fragma</span>
            </a>
            <nav class="sidebar__nav">
                <a href="/view/index.html" class="sidebar__link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="9"></rect>
                        <rect x="14" y="3" width="7" height="5"></rect>
                        <rect x="14" y="12" width="7" height="9"></rect>
                        <rect x="3" y="16" width="7" height="5"></rect>
                    </svg>
                    <span>View</span>
                </a>
                <a href="/dashboard/index.html" class="sidebar__link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    <span>Devices</span>
                </a>
                <a href="/simulation/index.html" class="sidebar__link sidebar__link--active">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                    <span>Simulation</span>
                </a>
                <a href="/docs/index.html" class="sidebar__link sidebar__link--bottom">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span>API Docs</span>
                </a>
            </nav>
        </aside>

        <main class="app-main">
            <div class="tb-top-bar">
                <div class="tb-breadcrumbs">
                    <span class="tb-breadcrumb-item tb-breadcrumb-item--active">Simulation</span>
                </div>
            </div>

            <div class="container tb-container" style="padding-top: 24px;">
                <div class="grid grid--2">
                    <div class="card">
                        <div style="margin-bottom: 24px;">
                            <h2 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 6px;">Simulator
                                Controls</h2>
                            <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0;">Push simulated
                                telemetry data to all active devices at a set interval.</p>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="simInterval">Interval (Seconds)</label>
                            <input type="number" id="simInterval" class="form-input" value="3" min="1" max="60">
                        </div>

                        <div style="margin-top: 28px; display: flex; gap: 12px;">
                            <button id="btnStart" class="btn btn--primary" style="flex: 1;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                </svg>
                                Start Simulation
                            </button>
                            <button id="btnStop" class="btn btn--danger" style="flex: 1; display: none;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <rect x="6" y="6" width="12" height="12"></rect>
                                </svg>
                                Stop Simulation
                            </button>
                        </div>
                    </div>

                    <div class="card" style="display: flex; flex-direction: column;">
                        <h2 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 12px;">Activity Log
                        </h2>

                        <div id="simLog" class="tb-code-box"
                            style="flex: 1; min-height: 220px; max-height: 320px; overflow-y: auto; background: #050508; color: #a1a1b5; font-size: 0.78rem; font-family: var(--font-mono);">
                            <div>[SYSTEM] Simulator is ready. Waiting for start...</div>
                        </div>
                    </div>
                </div>
            </div>


        </main>
    </div>

    <script src="/js/utils.js?v=20261021c"></script>
    <script src="/js/api.js?v=20261021c"></script>
    <script src="/js/simulation.js?v=20261021c"></script>
</body>

</html>
