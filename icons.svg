<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      .bg { fill: #0a0a0f; }
      .card { fill: #12121a; stroke: #1e1e2e; stroke-width: 1.5; rx: 8px; }
      .label { fill: #8888a0; font-family: 'Inter', sans-serif; font-size: 11px; text-anchor: middle; }
      .icon-stroke { stroke: #4ecdc4; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .icon-fill { fill: #4ecdc4; }
      .title { fill: #e0e0e8; font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <text x="30" y="38" class="title">Fragma IoT UI Icon Set (Vektor Murni)</text>

  <!-- 1. View / Global Canvas -->
  <g transform="translate(30, 60)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <rect x="3" y="3" width="7" height="9" class="icon-stroke"></rect>
      <rect x="14" y="3" width="7" height="5" class="icon-stroke"></rect>
      <rect x="14" y="12" width="7" height="9" class="icon-stroke"></rect>
      <rect x="3" y="16" width="7" height="5" class="icon-stroke"></rect>
    </g>
    <text x="50" y="75" class="label">View</text>
  </g>

  <!-- 2. Devices -->
  <g transform="translate(150, 60)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <line x1="8" y1="6" x2="21" y2="6" class="icon-stroke"></line>
      <line x1="8" y1="12" x2="21" y2="12" class="icon-stroke"></line>
      <line x1="8" y1="18" x2="21" y2="18" class="icon-stroke"></line>
      <line x1="3" y1="6" x2="3.01" y2="6" class="icon-stroke"></line>
      <line x1="3" y1="12" x2="3.01" y2="12" class="icon-stroke"></line>
      <line x1="3" y1="18" x2="3.01" y2="18" class="icon-stroke"></line>
    </g>
    <text x="50" y="75" class="label">Devices</text>
  </g>

  <!-- 3. Simulation -->
  <g transform="translate(270, 60)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2" class="icon-stroke"></path>
    </g>
    <text x="50" y="75" class="label">Simulation</text>
  </g>

  <!-- 4. API Docs -->
  <g transform="translate(390, 60)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" class="icon-stroke"></path>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" class="icon-stroke"></path>
    </g>
    <text x="50" y="75" class="label">API Docs</text>
  </g>

  <!-- 5. Add / Plus -->
  <g transform="translate(510, 60)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <line x1="12" y1="5" x2="12" y2="19" class="icon-stroke"></line>
      <line x1="5" y1="12" x2="19" y2="12" class="icon-stroke"></line>
    </g>
    <text x="50" y="75" class="label">Add Device</text>
  </g>

  <!-- 6. Refresh -->
  <g transform="translate(630, 60)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <polyline points="23 4 23 10 17 10" class="icon-stroke"></polyline>
      <polyline points="1 20 1 14 7 14" class="icon-stroke"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" class="icon-stroke"></path>
    </g>
    <text x="50" y="75" class="label">Refresh</text>
  </g>

  <!-- ROW 2 -->

  <!-- 7. Search -->
  <g transform="translate(30, 175)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <circle cx="11" cy="11" r="8" class="icon-stroke"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65" class="icon-stroke"></line>
    </g>
    <text x="50" y="75" class="label">Search</text>
  </g>

  <!-- 8. Filter -->
  <g transform="translate(150, 175)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" class="icon-stroke"></polygon>
    </g>
    <text x="50" y="75" class="label">Filter</text>
  </g>

  <!-- 9. Play Simulator -->
  <g transform="translate(270, 175)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <polygon points="5 3 19 12 5 21 5 3" class="icon-stroke"></polygon>
    </g>
    <text x="50" y="75" class="label">Start Sim</text>
  </g>

  <!-- 10. Stop Simulator -->
  <g transform="translate(390, 175)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <rect x="6" y="6" width="12" height="12" stroke="#e74c6f" stroke-width="2" fill="none"></rect>
    </g>
    <text x="50" y="75" class="label" fill="#e74c6f">Stop Sim</text>
  </g>

  <!-- 11. Weather Cloud -->
  <g transform="translate(510, 175)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(38, 20)">
      <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" class="icon-stroke"></path>
    </g>
    <text x="50" y="75" class="label">Bridge Weather</text>
  </g>

  <!-- 12. Fragma Logo Mark -->
  <g transform="translate(630, 175)">
    <rect width="100" height="90" class="card" />
    <g transform="translate(42, 22)">
      <circle cx="8" cy="8" r="7" fill="#4ecdc4"></circle>
      <circle cx="8" cy="8" r="3" fill="#0a0a0f"></circle>
    </g>
    <text x="50" y="75" class="label">Logo Mark</text>
  </g>
</svg>
