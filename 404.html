<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fragma | 404 Halaman Tidak Ditemukan</title>
    <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261125b">
    <style>
        .error-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background-color: var(--bg-base);
            text-align: center;
        }
        .error-content {
            max-width: 480px;
            width: 100%;
        }
        .error-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 24px;
        }
        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 16px;
            font-family: var(--font-mono);
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .error-description {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <main class="error-wrapper">
        <div class="error-content">
            <a href="/" class="error-brand">
                <img src="/img/logo.svg" alt="Fragma Logo" class="brand-logo">
                <span>Fragma</span>
            </a>
            <div class="error-code">404</div>
            <h1 class="error-title">Halaman tidak ditemukan</h1>
            <p class="error-description">Halaman yang Anda cari tidak tersedia atau telah dipindahkan.</p>
            <div class="error-actions">
                <a href="/projects" class="btn btn--primary">Buka Projects</a>
                <a href="/" class="btn btn--ghost">Kembali ke Beranda</a>
            </div>
        </div>
    </main>
</body>
</html>
