<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Fragma</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-header">
                <a href="/" class="auth-brand">
                    <span class="navbar__logo-dot"></span>
                    Fragma
                </a>
                <p class="auth-subtitle">Log in to your dashboard</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="username" class="form-label">Username</label>
                    </div>
                    <input type="text" id="username" name="username" class="form-input" required
                        autocomplete="username">
                    <span class="form-error" id="usernameError">Username is required</span>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <input type="password" id="password" name="password" class="form-input" required
                        autocomplete="current-password">
                    <span class="form-error" id="passwordError">Password is required</span>
                </div>

                <div class="form-summary form-summary--hidden" id="loginErrorSummary">
                    Invalid username or password
                </div>

                <button type="submit" class="btn btn--primary btn--full auth-card__submit" id="loginBtn">
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const loginErrorSummary = document.getElementById('loginErrorSummary');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            usernameInput.classList.remove('form-input--error');
            passwordInput.classList.remove('form-input--error');
            usernameError.classList.remove('form-error--visible');
            passwordError.classList.remove('form-error--visible');
            loginErrorSummary.classList.add('form-summary--hidden');

            let hasError = false;

            if (!usernameInput.value.trim()) {
                usernameInput.classList.add('form-input--error');
                usernameError.classList.add('form-error--visible');
                hasError = true;
            }

            if (!passwordInput.value.trim()) {
                passwordInput.classList.add('form-input--error');
                passwordError.classList.add('form-error--visible');
                hasError = true;
            }

            if (hasError) return;

            loginBtn.disabled = true;
            loginBtnText.textContent = 'Signing in...';

            setTimeout(() => {
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';

                loginErrorSummary.classList.remove('form-summary--hidden');
                passwordInput.value = '';
                passwordInput.focus();
            }, 1000);
        });
    </script>
</body>

</html>
