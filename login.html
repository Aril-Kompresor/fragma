<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Fragma</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background-color: var(--bg-base);
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            /* Using existing .card class styles but enforcing a max-width for focus */
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <main class="auth-wrapper">
        <div class="card auth-card">
            <div class="auth-header">
                <a href="/" class="auth-brand">
                    <span class="navbar__logo-dot"></span>
                    Fragma
                </a>
                <p class="auth-subtitle">Log in to your dashboard</p>
            </div>
            
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="username" class="form-label">Username</label>
                    </div>
                    <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
                    <span class="form-error" id="usernameError">Username is required</span>
                </div>
                
                <div class="form-group">
                    <div class="form-label-row">
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
                    <span class="form-error" id="passwordError">Password is required</span>
                </div>
                
                <!-- Mockup error state -->
                <div class="form-summary form-summary--hidden" id="loginErrorSummary">
                    Invalid username or password. This is a mockup error state.
                </div>
                
                <button type="submit" class="btn btn--primary" id="loginBtn" style="width: 100%; margin-top: 8px;">
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>
        </div>
    </main>

    <script>
        /**
         * Mockup logic to demonstrate UI states (Validation, Loading, Error)
         * without a real backend, adhering to R-27 (UI States).
         */
        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const loginErrorSummary = document.getElementById('loginErrorSummary');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Reset validation states
            usernameInput.classList.remove('form-input--error');
            passwordInput.classList.remove('form-input--error');
            usernameError.classList.remove('form-error--visible');
            passwordError.classList.remove('form-error--visible');
            loginErrorSummary.classList.add('form-summary--hidden');
            
            let hasError = false;
            
            if (!usernameInput.value.trim()) {
                usernameInput.classList.add('form-input--error');
                usernameError.classList.add('form-error--visible');
                hasError = true;
            }
            
            if (!passwordInput.value.trim()) {
                passwordInput.classList.add('form-input--error');
                passwordError.classList.add('form-error--visible');
                hasError = true;
            }
            
            if (hasError) return;
            
            // Simulate Loading state
            loginBtn.disabled = true;
            loginBtnText.textContent = 'Signing in...';
            loginBtn.style.opacity = '0.7';
            
            // Simulate network request and Error state response
            setTimeout(() => {
                loginBtn.disabled = false;
                loginBtnText.textContent = 'Sign In';
                loginBtn.style.opacity = '1';
                
                // Show generic auth error for mockup purposes
                loginErrorSummary.classList.remove('form-summary--hidden');
                passwordInput.value = ''; // clear password on error
                passwordInput.focus();
            }, 1000);
        });
    </script>
</body>
</html>
