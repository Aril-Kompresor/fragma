<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard: Fragma IoT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=20261021c">
    <script> </script>
</head>
<body>
    <div class="app-shell">
        <header class="mobile-header">
            <a href="/" class="sidebar__brand" style="padding: 0;">
                <span class="navbar__logo-dot"></span>
                <span>Fragma</span>
            </a>
        </header>

        <aside class="sidebar">
            <a href="/" class="sidebar__brand">
                <span class="navbar__logo-dot"></span>
                <span>Fragma</span>
            </a>
            <nav class="sidebar__nav">
                <a href="/view/index.html" class="sidebar__link" id="navView">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    <span>View</span>
                </a>
                <a href="/dashboard/index.html" class="sidebar__link sidebar__link--active" id="navEntity">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    <span>Devices</span>
                </a>
                <a href="/simulation/index.html" class="sidebar__link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                    <span>Simulation</span>
                </a>
                <a href="/docs/index.html" class="sidebar__link sidebar__link--bottom">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                    <span>API Docs</span>
                </a>
            </nav>
        </aside>

        <main class="app-main">
            <div class="tb-top-bar">
                <div class="tb-breadcrumbs">
                    <span class="tb-breadcrumb-item">Devices</span>
                    <span class="tb-breadcrumb-separator">&gt;</span>
                    <span class="tb-breadcrumb-item tb-breadcrumb-item--active">All</span>
                </div>
            </div>
            <div class="tb-sub-bar">
                <div class="tb-tabs" role="tablist">
                    <button type="button" class="tb-tab tb-tab--active" id="tabAllEntities" role="tab" aria-selected="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        <span>All</span>
                        <span class="tb-tab__count" id="countAllEntities">0</span>
                    </button>
                    <button type="button" class="tb-tab" id="tabActiveEntities" role="tab" aria-selected="false">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span>Active</span>
                        <span class="tb-tab__count" id="countActiveEntities">0</span>
                    </button>
                    <button type="button" class="tb-tab" id="tabInactiveEntities" role="tab" aria-selected="false">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
                        <span>Inactive</span>
                        <span class="tb-tab__count" id="countInactiveEntities">0</span>
                    </button>
                </div>
            </div>

            <div class="container tb-container">
                <div class="tb-panel">
                    <div class="tb-toolbar">
                        <div class="tb-toolbar__left">
                            <h1 class="tb-toolbar__title">Devices</h1>
                            <button type="button" class="tb-btn-tool" id="tbFilterBtn" title="Filter options">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                                <span>Device filter</span>
                            </button>
                            <label class="tb-switch-label" title="Toggle periodic live polling">
                                <input type="checkbox" id="tbPollingToggle" checked>
                                <span class="tb-switch-slider"></span>
                                <span>Live polling</span>
                            </label>
                        </div>
                        <div class="tb-toolbar__right">
                            <div class="tb-search-wrap">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <input type="text" id="tbSearchInput" class="tb-search-input" placeholder="Search devices..." autocomplete="off">
                            </div>
                            <button type="button" class="tb-icon-btn" id="tbRefreshBtn" title="Refresh device list">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                            </button>
                            <a href="/create/index.html" class="btn btn--primary btn--sm tb-add-btn">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                <span>Add device</span>
                            </a>
                        </div>
                    </div>

                    <div class="tb-table-container">
                        <table class="tb-table" id="entitiesTable">
                            <thead>
                                <tr>
                                    <th class="tb-th-checkbox" style="width: 44px;">
                                        <input type="checkbox" id="selectAllCheckbox" aria-label="Select all devices">
                                    </th>
                                    <th style="width: 170px;">Created time <span class="tb-sort-arrow">&darr;</span></th>
                                    <th style="min-width: 180px;">Name</th>
                                    <th style="min-width: 160px;">Device profile</th>
                                    <th style="width: 110px;">State</th>
                                    <th style="width: 120px;">Data points</th>
                                    <th style="width: 120px;">Last activity</th>
                                    <th style="width: 90px; text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="entitiesTableBody"></tbody>
                        </table>

                        <div id="entitiesLoading" class="tb-table-empty">
                            <div class="tb-loading-spinner"></div>
                            <div>Loading devices...</div>
                        </div>

                        <div id="entitiesEmptyState" class="tb-table-empty" style="display: none;">
                            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 12px;"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
                            <div style="font-size: 1.05rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px;">No devices found</div>
                            <div style="font-size: 0.85rem; color: var(--text-secondary); max-width: 400px; margin: 0 auto 16px auto;">Create your first device to start streaming telemetry data to Fragma.</div>
                            <button type="button" class="btn btn--primary btn--sm" onclick="openCreateModal()">+ Add device</button>
                        </div>
                    </div>

                    <div class="tb-pagination">
                        <div class="tb-pagination__left">
                            <span>Items per page:</span>
                            <select id="itemsPerPageSelect" class="tb-page-select">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>
                        <div class="tb-pagination__right">
                            <span id="tbPaginationInfo" class="tb-pagination__info">0 - 0 of 0</span>
                            <div class="tb-pagination__controls">
                                <button type="button" id="btnPageFirst" class="tb-page-btn" title="First page" disabled>&laquo;</button>
                                <button type="button" id="btnPagePrev" class="tb-page-btn" title="Previous page" disabled>&lsaquo;</button>
                                <button type="button" id="btnPageNext" class="tb-page-btn" title="Next page" disabled>&rsaquo;</button>
                                <button type="button" id="btnPageLast" class="tb-page-btn" title="Last page" disabled>&raquo;</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            

        </main>
    </div>



    <script src="/js/utils.js?v=20261021c"></script>
    <script src="/js/api.js?v=20261021c"></script>
    <script src="/js/app.js?v=20261021c"></script>
</body>
</html>
